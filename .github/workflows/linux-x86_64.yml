name: Linux x86_64

on:
    workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged

    steps:
    - name: Install Dependencies
      run: |
        apt update
        apt install -y qt6-base-dev qt6-declarative-dev qt6-5compat-dev rustup clang \ 
          pkg-config \
          libfreetype-dev \
          libfontconfig-dev \
          libegl-dev \
          libgl-dev \
          libgles-dev \
          libwayland-dev
        rustup default stable
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --release --verbose
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: reimei-linux-x86_64
        path: target/release/reimei
        archive: false
